<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <!-- Chrome, Firefox OS and Opera -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#FFFFFF" />
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#FFFFFF" />
    <div style="display:none">
    {{ $defaultTitle := "Find a time to meet" }}
    {{ $defaultDescription := "A quick availability poll for finding the best time for a group to meet." }}
    </div>
    <title>{{ or .title $defaultTitle }}</title>
    <meta 
      name="description" 
      content="{{or .description $defaultDescription }}" 
    />
    <meta property="og:title" content="{{or .ogTitle $defaultTitle}}" />
    <meta property="og:description" content="{{or .ogDescription $defaultDescription }}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <strong>This page needs JavaScript. Please turn it on and reload.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
